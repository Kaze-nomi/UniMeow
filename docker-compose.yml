services:
  postgres-user:
    image: ${POSTGRES_IMAGE:-postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50}
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
    - postgres_user_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5432:5432
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USERNAME:-postgres} -d user_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postgres-notification:
    image: ${POSTGRES_IMAGE:-postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50}
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
    - postgres_notification_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5435:5432
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USERNAME:-postgres} -d notification_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postgres-post:
    image: ${POSTGRES_IMAGE:-postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50}
    restart: unless-stopped
    environment:
      POSTGRES_DB: post_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
    - postgres_post_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5433:5432
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USERNAME:-postgres} -d post_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: ${REDIS_IMAGE:-redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99}
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
    ports:
    - 127.0.0.1:6379:6379
    volumes:
    - redis_data:/data
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:4f75fd76598afa23919555d1363e1fb13c632d9bcd4ce8edcf21d3cca2ed0579
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
    - minio_data:/data
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD
      - bash
      - -ec
      - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /minio/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; IFS= read -r status <&3; [[ "$$status" == *" 200 "* ]]'
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.0.0@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ZmVlZHNlcnZpY2VrcmFmdA
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
    - kafka_data:/var/lib/kafka/data
    - kafka_secrets:/etc/kafka/secrets
    - kafka_config:/mnt/shared/config
    ports:
    - 127.0.0.1:9094:9092
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: uni-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
    ports:
    - 127.0.0.1:8085:8080
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    profiles:
    - tools
  eureka-server:
    build:
      context: ./Eureka
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8761/actuator/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
  user-service:
    build:
      context: .
      dockerfile: UserService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      media-service:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_FRONTEND_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      OUTBOX_NAMESPACE: ${OUTBOX_NAMESPACE:-unimeow-dev}
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9000/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
  media-service:
    build:
      context: .
      dockerfile: MediaService/Dockerfile
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-changeme}
      MINIO_PUBLIC_URL: ${APP_MINIO_PUBLIC_URL:-http://localhost:9000}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9003/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
  post-service:
    build:
      context: .
      dockerfile: PostService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-post:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      post-migrate:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-post:5432/post_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      OUTBOX_NAMESPACE: ${OUTBOX_NAMESPACE:-unimeow-dev}
      SPRING_KAFKA_CONSUMER_PROPERTIES_ISOLATION_LEVEL: read_committed
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9001/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
  feed-service:
    build:
      context: .
      dockerfile: FeedService/Dockerfile
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      SPRING_KAFKA_CONSUMER_PROPERTIES_ISOLATION_LEVEL: read_committed
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9002/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
  notification-service:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-notification:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      SPRING_KAFKA_CONSUMER_PROPERTIES_ISOLATION_LEVEL: read_committed
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9006/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
  api-gateway:
    build:
      context: .
      dockerfile: APIGateway/Dockerfile
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      feed-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      APP_SECURITY_SECURE_COOKIE: ${APP_SECURITY_SECURE_COOKIE:-false}
      APP_SECURITY_ALLOWED_ORIGINS: ${APP_SECURITY_ALLOWED_ORIGINS:-http://localhost:*,null}
      APP_SECURITY_OAUTH2_SUCCESS_REDIRECT: ${APP_PUBLIC_URL:-http://localhost:5173}/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: '6379'
      GATEWAY_SESSION_NAMESPACE: ${GATEWAY_SESSION_NAMESPACE:-unimeow-dev:gateway:sessions}
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
    - 127.0.0.1:5173:80
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
    environment:
      FRONTEND_API_BASE: ${FRONTEND_API_BASE:-http://localhost:8081}
      MINIO_PUBLIC_URL: ${APP_MINIO_PUBLIC_URL:-http://localhost:9000}
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1/runtime-config.json >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.53.4@sha256:502ad90314c7485892ce696cb14a99fceab9fc27af29f4b427f41bd39701a199}
    restart: unless-stopped
    volumes:
    - ./Monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    ports:
    - 127.0.0.1:9700:9090
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.6.1@sha256:52c3e20686b860c6dc1f623811565773cf51eefa378817a4896dfc863c3c82c8}
    restart: unless-stopped
    depends_on:
    - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - grafana_data:/var/lib/grafana
    - ./Monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
    - 127.0.0.1:3000:3000
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  gateway-proxy:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
    - 127.0.0.1:8081:8080
    volumes:
    - ./ops/gateway-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
    - uni-network
    stop_grace_period: 60s
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit
        1
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  user-migrate:
    build:
      context: .
      dockerfile: UserService/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_FRONTEND_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      OUTBOX_NAMESPACE: ${OUTBOX_NAMESPACE:-unimeow-dev}
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - migrate
    restart: 'no'
    depends_on:
      postgres-user:
        condition: service_healthy
  post-migrate:
    build:
      context: .
      dockerfile: PostService/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-post:5432/post_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      OUTBOX_NAMESPACE: ${OUTBOX_NAMESPACE:-unimeow-dev}
      SPRING_KAFKA_CONSUMER_PROPERTIES_ISOLATION_LEVEL: read_committed
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - migrate
    restart: 'no'
    depends_on:
      postgres-post:
        condition: service_healthy
  notification-migrate:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      SPRING_KAFKA_CONSUMER_PROPERTIES_ISOLATION_LEVEL: read_committed
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - migrate
    restart: 'no'
    depends_on:
      postgres-notification:
        condition: service_healthy
volumes:
  postgres_user_data: null
  postgres_post_data: null
  postgres_notification_data: null
  redis_data: null
  kafka_data: null
  minio_data: null
  prometheus_data: null
  grafana_data: null
  kafka_secrets: null
  kafka_config: null
networks:
  uni-network:
    driver: bridge
name: ${COMPOSE_PROJECT_NAME:-unimeow-dev}
