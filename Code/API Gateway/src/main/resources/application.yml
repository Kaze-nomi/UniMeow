server:
  port: 8080

app:
  security:
    secure-cookie: false

spring:
  application:
    name: api-gateway
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

grpc:
  client:
    user-service:
      address: 'discovery:///user-service'
      negotiation-type: plaintext

jwt:
  secret: ${JWT_SECRET}