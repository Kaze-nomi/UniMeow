server:
  port: 9001

spring:
  application:
    name: post-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-post:5432/post_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: all
      retries: 10
      client-id: post-service-outbox-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5
        compression.type: zstd
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:post-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

app:
  kafka:
    topics:
      user-events: user-events
      post-events: post-events
      post-events-dlq: post-events.dlq
  outbox:
    publish-delay-ms: 1500
  idempotency:
    retention-hours: 24
    cleanup-cron: "0 30 3 * * *"

grpc:
  server:
    port: 9091
    permit-keep-alive-without-calls: true
    permit-keep-alive-time: 1s
  client:
    user-service:
      address: 'discovery:///user-service'
      negotiation-type: plaintext
      default-load-balancing-policy: round_robin
      keep-alive-time: 1s
      keep-alive-timeout: 1s
      keep-alive-without-calls: true
      enable-keep-alive: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
