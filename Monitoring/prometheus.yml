global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [api-gateway]
        type: A
        port: 8080

  - job_name: user-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [user-service]
        type: A
        port: 9000

  - job_name: post-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [post-service]
        type: A
        port: 9001

  - job_name: feed-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [feed-service]
        type: A
        port: 9002

  - job_name: media-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [media-service]
        type: A
        port: 9003

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [notification-service]
        type: A
        port: 9006
