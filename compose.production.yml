services:
  postgres-user:
    image: ${POSTGRES_IMAGE:?Existing infrastructure image is required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USERNAME:?Required production setting}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Required production setting}
    volumes:
    - postgres_user_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5432:5432
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USERNAME:?Required production setting} -d user_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postgres-notification:
    image: ${POSTGRES_IMAGE:?Existing infrastructure image is required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${DB_USERNAME:?Required production setting}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Required production setting}
    volumes:
    - postgres_notification_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5435:5432
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USERNAME:?Required production setting} -d notification_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postgres-post:
    image: ${POSTGRES_IMAGE:?Existing infrastructure image is required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: post_db
      POSTGRES_USER: ${DB_USERNAME:?Required production setting}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Required production setting}
    volumes:
    - postgres_post_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5433:5432
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USERNAME:?Required production setting} -d post_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: ${REDIS_IMAGE:?Existing infrastructure image is required}
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
    ports:
    - 127.0.0.1:6379:6379
    volumes:
    - redis_data:/data
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  minio:
    image: ${MINIO_IMAGE:?Existing infrastructure image is required}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Required production setting}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Required production setting}
    volumes:
    - minio_data:/data
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  kafka:
    image: ${KAFKA_IMAGE:?Existing infrastructure image is required}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ZmVlZHNlcnZpY2VrcmFmdA
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
    - kafka_data:/var/lib/kafka/data
    - kafka_secrets:/etc/kafka/secrets
    - kafka_config:/mnt/shared/config
    ports:
    - 127.0.0.1:9094:9092
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  eureka-server:
    restart: unless-stopped
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8761/actuator/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
    image: ${EUREKA_SERVER_IMAGE:?Release digest is required}
    platform: linux/amd64
  user-service:
    restart: unless-stopped
    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      media-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Required production setting}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Required production setting}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:?Required production setting}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?Required production setting}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_FRONTEND_URL: ${APP_PUBLIC_URL:?Required production setting}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      OUTBOX_NAMESPACE: ${OUTBOX_NAMESPACE:?Required production setting}
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9000/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
    image: ${USER_SERVICE_IMAGE:?Release digest is required}
    platform: linux/amd64
  media-service:
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Required production setting}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Required production setting}
      MINIO_PUBLIC_URL: ${APP_MINIO_PUBLIC_URL:?Required production setting}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9003/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
    image: ${MEDIA_SERVICE_IMAGE:?Release digest is required}
    platform: linux/amd64
  post-service:
    restart: unless-stopped
    depends_on:
      postgres-post:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-post:5432/post_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Required production setting}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Required production setting}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      OUTBOX_NAMESPACE: ${OUTBOX_NAMESPACE:?Required production setting}
      SPRING_KAFKA_CONSUMER_PROPERTIES_ISOLATION_LEVEL: read_committed
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9001/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
    image: ${POST_SERVICE_IMAGE:?Release digest is required}
    platform: linux/amd64
  feed-service:
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      SPRING_KAFKA_CONSUMER_PROPERTIES_ISOLATION_LEVEL: read_committed
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9002/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
    image: ${FEED_SERVICE_IMAGE:?Release digest is required}
    platform: linux/amd64
  notification-service:
    restart: unless-stopped
    depends_on:
      postgres-notification:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Required production setting}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Required production setting}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      SPRING_KAFKA_CONSUMER_PROPERTIES_ISOLATION_LEVEL: read_committed
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9006/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
    image: ${NOTIFICATION_SERVICE_IMAGE:?Release digest is required}
    platform: linux/amd64
  api-gateway:
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      feed-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Required production setting}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Required production setting}
      JWT_SECRET: ${JWT_SECRET:?Required production setting}
      APP_SECURITY_SECURE_COOKIE: ${APP_SECURITY_SECURE_COOKIE:?Required production
        setting}
      APP_SECURITY_ALLOWED_ORIGINS: ${APP_SECURITY_ALLOWED_ORIGINS:?Required production
        setting}
      APP_SECURITY_OAUTH2_SUCCESS_REDIRECT: ${APP_PUBLIC_URL:?Required production
        setting}/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: '6379'
      GATEWAY_SESSION_NAMESPACE: ${GATEWAY_SESSION_NAMESPACE:?Required production
        setting}
    networks:
    - uni-network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/actuator/health/readiness || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
    image: ${API_GATEWAY_IMAGE:?Release digest is required}
    platform: linux/amd64
  frontend:
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
    - 127.0.0.1:5173:80
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 60s
    environment:
      FRONTEND_API_BASE: ${APP_PUBLIC_URL:?Required production setting}
      MINIO_PUBLIC_URL: ${APP_MINIO_PUBLIC_URL:?Required production setting}
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1/runtime-config.json >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    image: ${FRONTEND_IMAGE:?Release digest is required}
    platform: linux/amd64
  prometheus:
    image: ${PROMETHEUS_IMAGE:?Existing infrastructure image is required}
    restart: unless-stopped
    volumes:
    - ./Monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    ports:
    - 127.0.0.1:9700:9090
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  grafana:
    image: ${GRAFANA_IMAGE:?Existing infrastructure image is required}
    restart: unless-stopped
    depends_on:
    - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?Required production setting}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Required production setting}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - grafana_data:/var/lib/grafana
    - ./Monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
    - 127.0.0.1:3000:3000
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  gateway-proxy:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
    - 127.0.0.1:8081:8080
    volumes:
    - ./ops/gateway-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
    - uni-network
    stop_grace_period: 60s
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit
        1
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  user-migrate:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Required production setting}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Required production setting}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:?Required production setting}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?Required production setting}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_FRONTEND_URL: ${APP_PUBLIC_URL:?Required production setting}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      OUTBOX_NAMESPACE: ${OUTBOX_NAMESPACE:?Required production setting}
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - migrate
    restart: 'no'
    depends_on:
      postgres-user:
        condition: service_healthy
    image: ${USER_SERVICE_IMAGE:?Release digest is required}
    platform: linux/amd64
    profiles:
    - migrate
  post-migrate:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-post:5432/post_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Required production setting}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Required production setting}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      OUTBOX_NAMESPACE: ${OUTBOX_NAMESPACE:?Required production setting}
      SPRING_KAFKA_CONSUMER_PROPERTIES_ISOLATION_LEVEL: read_committed
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - migrate
    restart: 'no'
    depends_on:
      postgres-post:
        condition: service_healthy
    image: ${POST_SERVICE_IMAGE:?Release digest is required}
    platform: linux/amd64
    profiles:
    - migrate
  notification-migrate:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Required production setting}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Required production setting}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:ActiveProcessorCount=2}
      SPRING_KAFKA_CONSUMER_PROPERTIES_ISOLATION_LEVEL: read_committed
    networks:
    - uni-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - migrate
    restart: 'no'
    depends_on:
      postgres-notification:
        condition: service_healthy
    image: ${NOTIFICATION_SERVICE_IMAGE:?Release digest is required}
    platform: linux/amd64
    profiles:
    - migrate
volumes:
  postgres_user_data:
    external: true
    name: ${VOLUME_POSTGRES_USER_DATA:?Existing volume name is required}
  postgres_post_data:
    external: true
    name: ${VOLUME_POSTGRES_POST_DATA:?Existing volume name is required}
  postgres_notification_data:
    external: true
    name: ${VOLUME_POSTGRES_NOTIFICATION_DATA:?Existing volume name is required}
  redis_data:
    external: true
    name: ${VOLUME_REDIS_DATA:?Existing volume name is required}
  kafka_data:
    external: true
    name: ${VOLUME_KAFKA_DATA:?Existing volume name is required}
  minio_data:
    external: true
    name: ${VOLUME_MINIO_DATA:?Existing volume name is required}
  prometheus_data:
    external: true
    name: ${VOLUME_PROMETHEUS_DATA:?Existing volume name is required}
  grafana_data:
    external: true
    name: ${VOLUME_GRAFANA_DATA:?Existing volume name is required}
  kafka_secrets:
    external: true
    name: ${VOLUME_KAFKA_SECRETS:?Existing volume name is required}
  kafka_config:
    external: true
    name: ${VOLUME_KAFKA_CONFIG:?Existing volume name is required}
networks:
  uni-network:
    driver: bridge
name: ${COMPOSE_PROJECT_NAME:?Existing production Compose project is required}
