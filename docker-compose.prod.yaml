services:

  postgres-user:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       user_db
      POSTGRES_USER:     ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?DB_USERNAME is required} -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-notification:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       notification_db
      POSTGRES_USER:     ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?DB_USERNAME is required} -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-post:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       post_db
      POSTGRES_USER:     ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_post_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?DB_USERNAME is required} -d post_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - uni-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - uni-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ZmVlZHNlcnZpY2VrcmFmdA
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9092"
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: uni-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
    ports:
      - "127.0.0.1:8085:8080"
    networks:
      - uni-network

  migrations:
    image: flyway/flyway:11.14.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        flyway -url=jdbc:postgresql://postgres-user:5432/user_db -locations=filesystem:/flyway/sql/user migrate &&
        flyway -url=jdbc:postgresql://postgres-post:5432/post_db -locations=filesystem:/flyway/sql/post migrate &&
        flyway -url=jdbc:postgresql://postgres-notification:5432/notification_db -locations=filesystem:/flyway/sql/notification migrate
    environment:
      FLYWAY_USER: ${DB_USERNAME:?DB_USERNAME is required}
      FLYWAY_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./UserService/src/main/resources/db/migration:/flyway/sql/user:ro
      - ./PostService/src/main/resources/db/migration:/flyway/sql/post:ro
      - ./NotificationService/src/main/resources/db/migration:/flyway/sql/notification:ro
    depends_on:
      postgres-user:
        condition: service_healthy
      postgres-post:
        condition: service_healthy
      postgres-notification:
        condition: service_healthy
    networks:
      - uni-network

  eureka-server:
    image: ghcr.io/kaze-nomi/unimeow-eureka-server:${VERSION:?VERSION is required}
    stop_grace_period: 40s
    restart: unless-stopped
    ports:
      - "127.0.0.1:8761:8761"
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

  user-service:
    image: ghcr.io/kaze-nomi/unimeow-user-service:${VERSION:?VERSION is required}
    stop_grace_period: 40s
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres-user:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      media-service:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_FRONTEND_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

  media-service:
    image: ghcr.io/kaze-nomi/unimeow-media-service:${VERSION:?VERSION is required}
    stop_grace_period: 40s
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_PUBLIC_URL: ${APP_MINIO_PUBLIC_URL:?APP_MINIO_PUBLIC_URL is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9003/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

  post-service:
    image: ghcr.io/kaze-nomi/unimeow-post-service:${VERSION:?VERSION is required}
    stop_grace_period: 40s
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres-post:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres-post:5432/post_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9001/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

  feed-service:
    image: ghcr.io/kaze-nomi/unimeow-feed-service:${VERSION:?VERSION is required}
    stop_grace_period: 40s
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9002/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

  notification-service:
    image: ghcr.io/kaze-nomi/unimeow-notification-service:${VERSION:?VERSION is required}
    stop_grace_period: 40s
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres-notification:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres-notification:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9006/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

  api-gateway:
    image: ghcr.io/kaze-nomi/unimeow-api-gateway:${VERSION:?VERSION is required}
    stop_grace_period: 40s
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      feed-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATA_REDIS_HOST: redis
      GOOGLE_CLIENT_ID:                       ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET:                   ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      JWT_SECRET:                             ${JWT_SECRET:?JWT_SECRET is required}
      APP_SECURITY_SECURE_COOKIE:             ${APP_SECURITY_SECURE_COOKIE:?APP_SECURITY_SECURE_COOKIE is required}
      APP_SECURITY_ALLOWED_ORIGINS:           ${APP_SECURITY_ALLOWED_ORIGINS:?APP_SECURITY_ALLOWED_ORIGINS is required}
      APP_SECURITY_OAUTH2_SUCCESS_REDIRECT:   ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

  frontend:
    image: ghcr.io/kaze-nomi/unimeow-frontend:${VERSION:?VERSION is required}
    stop_grace_period: 40s
    environment:
      FRONTEND_API_BASE: ${FRONTEND_API_BASE:-${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}}
      MINIO_PUBLIC_URL: ${APP_MINIO_PUBLIC_URL:?APP_MINIO_PUBLIC_URL is required}
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
      - "127.0.0.1:8081:8080"
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.53.4
    restart: unless-stopped
    volumes:
      - ./Monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "127.0.0.1:9700:9090"
    networks:
      - uni-network

  grafana:
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - uni-network

volumes:
  postgres_user_data:
  postgres_post_data:
  postgres_notification_data:
  redis_data:
  kafka_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  uni-network:
    driver: bridge
