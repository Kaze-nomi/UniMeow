- name: Configure UniMeow routing
  hosts: all
  become: true
  gather_facts: false
  vars:
    project_dir: /root/UniMeow
    backup_dir: /var/backups/unimeow
    nginx_site: /etc/nginx/sites-enabled/unimeow.ru
    routing: [socket-proxy, traefik]
    routing_compose: "{{ lookup('ansible.builtin.file', '../docker-compose.prod.yaml') | from_yaml }}"
    routing_configuration:
      services: "{{ routing_compose.services | dict2items | selectattr('key', 'in', routing) | items2dict }}"
      networks:
        docker-control: "{{ routing_compose.networks['docker-control'] }}"
  module_defaults:
    community.docker.docker_compose_v2:
      project_src: /root/UniMeow
      project_name: unimeow
      files: [docker-compose.prod.yaml]
      env_files: [.env.prod]
      build: never
      pull: never
      dependencies: false
      wait: true
      wait_timeout: 300
  tasks:
    - name: Install the Docker module dependency
      ansible.builtin.apt:
        name: python3-requests
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: Read the existing application network
      community.docker.docker_network_info:
        name: unimeow_uni-network
      register: application_network

    - name: Require the existing Docker bridge
      ansible.builtin.assert:
        that:
          - application_network.exists
          - application_network.network.IPAM.Config | length == 1
          - application_network.network.IPAM.Config[0].Gateway is defined

    - name: Trust only the server proxy
      ansible.builtin.set_fact:
        trusted_proxy_ips: "127.0.0.1/32,{{ application_network.network.IPAM.Config[0].Gateway }}/32"

    - name: Read the existing Compose file
      ansible.builtin.slurp:
        src: "{{ project_dir }}/docker-compose.prod.yaml"
      register: compose_before
      no_log: true

    - name: Read the existing Nginx site
      ansible.builtin.slurp:
        src: "{{ nginx_site }}"
      register: nginx_before

    - name: Require the known API routing
      ansible.builtin.assert:
        that: nginx_before.content | b64decode | regex_findall('proxy_pass\s+http://127\.0\.0\.1:808[12];') | length == 6

    - name: Create the private configuration backup directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'

    - name: Preserve the configuration before introducing Traefik
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ backup_dir }}/{{ item.dest }}"
        remote_src: true
        force: false
        mode: '0600'
      loop:
        - {src: /etc/nginx/sites-enabled/unimeow.ru, dest: nginx.before-traefik.conf}
        - {src: /root/UniMeow/docker-compose.prod.yaml, dest: compose.before-traefik.yaml}

    - name: Download the routing images before changing configuration
      community.docker.docker_image_pull:
        name: "{{ routing_compose.services[item].image }}"
        pull: not_present
      loop: "{{ routing }}"

    - name: Install and verify the routing
      block:
        - name: Add routing services while preserving the current application
          ansible.builtin.copy:
            content: "{{ (compose_before.content | b64decode | from_yaml | combine(routing_configuration, recursive=true) | to_nice_yaml) | replace('${TRUSTED_PROXY_IPS:-127.0.0.1/32}', trusted_proxy_ips) }}"
            dest: "{{ project_dir }}/docker-compose.prod.yaml"
            mode: '0600'
          no_log: true

        - name: Start the routing services one at a time
          community.docker.docker_compose_v2:
            services: ["{{ item }}"]
          loop: "{{ routing }}"

        - name: Verify Traefik reaches the existing Gateway
          ansible.builtin.uri:
            url: http://127.0.0.1:8082/actuator/health
            return_content: true
          register: direct_health
          until: direct_health.status == 200 and direct_health.json.status == 'UP'
          retries: 12
          delay: 5

        - name: Route API requests through Traefik
          ansible.builtin.replace:
            path: "{{ nginx_site }}"
            regexp: '(proxy_pass\s+http://127\.0\.0\.1:)8081;'
            replace: '\g<1>8082;'
          register: nginx_changed

        - name: Set public forwarding headers at the trusted edge
          ansible.builtin.replace:
            path: "{{ nginx_site }}"
            regexp: '(proxy_pass\s+http://127\.0\.0\.1:8082;)(?!\n[ \t]+proxy_set_header[ \t]+Forwarded)'
            replace: '\g<1>\n        proxy_set_header Forwarded "";\n        proxy_set_header X-Forwarded-Host $host;\n        proxy_set_header X-Forwarded-Port $server_port;\n        proxy_set_header X-Forwarded-Prefix "";'
          register: forwarding_changed

        - name: Validate the complete Nginx configuration
          ansible.builtin.command:
            argv: [nginx, -t]
          changed_when: false

        - name: Reload Nginx
          ansible.builtin.systemd_service:
            name: nginx
            state: reloaded
          when: nginx_changed.changed or forwarding_changed.changed

        - name: Verify public application readiness
          ansible.builtin.uri:
            url: https://unimeow.ru/actuator/health
            return_content: true
          register: public_health
          until: public_health.status == 200 and public_health.json.status == 'UP'
          retries: 6
          delay: 5

        - name: Verify public GraphQL routing
          ansible.builtin.uri:
            url: https://unimeow.ru/graphql
            method: POST
            body_format: json
            body:
              query: '{ __typename }'
            return_content: true
          register: graphql
          failed_when: graphql.status != 200 or graphql.json.data.__typename != 'Query'

        - name: Read normal and forged-header OAuth redirects
          ansible.builtin.uri:
            url: https://unimeow.ru/oauth2/authorization/google
            follow_redirects: none
            status_code: 302
            headers: "{{ item }}"
          loop:
            - {}
            - Forwarded: 'for=192.0.2.1;host=example.invalid;proto=http'
            - X-Forwarded-Host: example.invalid
              X-Forwarded-Proto: http
              X-Forwarded-Port: '80'
              X-Forwarded-Prefix: /forged
          register: oauth
          no_log: true

        - name: Verify OAuth keeps the public HTTPS callback
          ansible.builtin.assert:
            that: "'redirect_uri=https://unimeow.ru/login/oauth2/code/google' in (item.location | urlsplit('query') | urldecode)"
            fail_msg: OAuth callback must preserve the public HTTPS address.
          loop: "{{ oauth.results }}"
          no_log: true

      rescue:
        - name: Restore the previous Nginx configuration
          ansible.builtin.copy:
            content: "{{ nginx_before.content | b64decode }}"
            dest: "{{ nginx_site }}"
            mode: '0644'

        - name: Validate the restored Nginx configuration
          ansible.builtin.command:
            argv: [nginx, -t]
          changed_when: false

        - name: Reload the previous routing
          ansible.builtin.systemd_service:
            name: nginx
            state: reloaded

        - name: Restore the previous Compose file
          ansible.builtin.copy:
            content: "{{ compose_before.content | b64decode }}"
            dest: "{{ project_dir }}/docker-compose.prod.yaml"
            mode: '0600'
          no_log: true

        - name: Report unsuccessful routing setup
          ansible.builtin.fail:
            msg: Routing setup failed. Previous Nginx and Compose configuration was restored; application images and data were not changed.
