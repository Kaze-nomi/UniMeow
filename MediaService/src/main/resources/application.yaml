server:
  port: 9003

spring:
  application:
    name: media-service

app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:changeme}
    public-base-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    max-file-size:
      university-icons-bytes: ${MINIO_MAX_UNIVERSITY_ICON_SIZE:10485760}
      user-avatars-bytes: ${MINIO_MAX_USER_AVATAR_SIZE:5242880}
      user-banners-bytes: ${MINIO_MAX_USER_BANNER_SIZE:10485760}
      post-media-bytes: ${MINIO_MAX_POST_MEDIA_SIZE:52428800}

grpc:
  server:
    port: 9093
    permit-keep-alive-without-calls: true
    permit-keep-alive-time: 20s

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
