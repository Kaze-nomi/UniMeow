name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to install, for example v1.0.1. Choose an older version to roll back.'
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Download the selected build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$VERSION" --dir release-artifact --pattern unimeow.tar.gz
          tar -xzf release-artifact/unimeow.tar.gz -C release-artifact
      - name: Install Ansible
        run: |
          pip install ansible-core==2.19.3
          ansible-galaxy collection install -r deploy/requirements.yml
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy with Ansible
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$SSH_PORT" =~ ^[0-9]+$ ]]
          ansible-playbook -i "$SSH_HOST," -u "$SSH_USER" deploy/release.yml -e "version=$VERSION ansible_port=$SSH_PORT"
