name: Release
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'New immutable release, for example v1.0.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-release-lifecycle
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate release ID and default branch
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 -c 'import os,sys; sys.path.insert(0,"ops"); from release import RELEASE_ID; assert RELEASE_ID.fullmatch(os.environ["RELEASE_ID"])'
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          if gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; releases cannot be overwritten.' >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_ID" >/dev/null 2>&1; then
            echo 'This release ID is already recorded in Git and cannot be reused.' >&2
            exit 1
          fi
  tests:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { service: api-gateway, dockerfile: APIGateway/Dockerfile }
          - { service: eureka-server, dockerfile: Eureka/Dockerfile }
          - { service: user-service, dockerfile: UserService/Dockerfile }
          - { service: post-service, dockerfile: PostService/Dockerfile }
          - { service: feed-service, dockerfile: FeedService/Dockerfile }
          - { service: notification-service, dockerfile: NotificationService/Dockerfile }
          - { service: media-service, dockerfile: MediaService/Dockerfile }
          - { service: frontend, dockerfile: Frontend/Dockerfile }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Canonical image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: echo "image=ghcr.io/${OWNER,,}/unimeow-$SERVICE" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.name.outputs.image }}:${{ inputs.release_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record the exact built image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: mkdir -p digests && printf '%s\n' "$DIGEST" > "digests/$SERVICE.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: digest-${{ matrix.service }}
          path: digests/*.txt
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare complete immutable release
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          OWNER: ${{ github.repository_owner }}
        run: python3 ops/release.py --release-id "$RELEASE_ID" --commit "$GITHUB_SHA" --build-id "$GITHUB_RUN_ID" --owner "$OWNER"
      - name: Verify the exact published images on synthetic data
        run: python3 ops/verify_release.py --release-env release-output/release.env
      - name: Publish manifest and launch bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          printf 'Production версия %s\n' "${RELEASE_ID#v}" > release-notes.txt
          gh release create "$RELEASE_ID" --target "$GITHUB_SHA" --title "$RELEASE_ID" --notes-file release-notes.txt release-output/release.json release-output/release.env release-output/runtime.tar.gz release-output/SHA256SUMS
