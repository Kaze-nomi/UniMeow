name: CI
on:
  pull_request:
    branches: [meow]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example v1.1.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    name: CI
    if: >-
      (github.event_name == 'pull_request' && (github.event.action != 'closed' || github.event.pull_request.merged == true)) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/meow')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ github.event_name != 'workflow_dispatch' && format('v1.0.{0}', github.run_number) || inputs.version }}
      SERVICES: eureka-server media-service user-service post-service feed-service notification-service api-gateway frontend
      COMPOSE_PARALLEL_LIMIT: '1'
      COMPOSE_PROJECT_NAME: unimeow-ci
      COMPOSE_ENV_FILES: .env.example
      PUBLISH: ${{ github.ref == 'refs/heads/meow' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Select next version
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$PREVIOUS" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          VERSION="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1))"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Next version: $VERSION"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Lint
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
          docker compose -f docker-compose.dev.yaml config --quiet
          docker compose -f docker-compose.prod.yaml config --quiet
          bash gradlew check -x test --no-daemon --max-workers=2
      - name: Build
        run: |
          if [[ "$PUBLISH" == true ]]; then
            TAG=$(git ls-remote --tags origin "refs/tags/$VERSION")
            if [[ -n "$TAG" ]]; then
              echo "Version $VERSION already exists" >&2
              exit 1
            fi
          fi
          for service in $SERVICES; do
            docker compose -f docker-compose.dev.yaml build "$service"
          done
      - name: Test
        run: |
          trap 'docker compose -f docker-compose.dev.yaml -f tests/e2e/compose.oauth.yaml down' EXIT
          bash gradlew test --no-daemon --max-workers=2
          for service in socket-proxy traefik $SERVICES prometheus grafana; do
            docker compose -f docker-compose.prod.yaml -f tests/e2e/compose.oauth.yaml up -d --no-build --wait "$service"
          done
          python3 -m venv .venv
          .venv/bin/pip install -r tests/e2e/requirements.txt
          .venv/bin/python -m pytest tests/e2e -q --tb=short --junitxml=build/e2e-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            **/build/test-results/**/*.xml
            build/e2e-results.xml
            **/build/reports/pmd/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push to GHCR
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r -a APP_IMAGES <<< "$SERVICES"
          docker compose -f docker-compose.dev.yaml push "${APP_IMAGES[@]}"
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" --title "$VERSION" --notes "Production версия ${VERSION#v}"
