name: Build
on:
  push:
    branches: [meow]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version, for example v1.1.0'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build, test and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['16379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version || format('v1.0.{0}', github.run_number) }}
      SERVICES: eureka-server media-service user-service post-service feed-service notification-service api-gateway frontend
      COMPOSE_PARALLEL_LIMIT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Validate version
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Reject an already published version
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -Fxq "$VERSION" <<< "$RELEASES"; then
            echo "Version $VERSION is already published" >&2
            exit 1
          fi
          TAG=$(git ls-remote --tags origin "refs/tags/$VERSION")
          if [[ -n "$TAG" ]]; then
            echo "Version $VERSION already has a Git tag" >&2
            exit 1
          fi
      - name: Build eight application images
        run: |
          set -euo pipefail
          for service in $SERVICES; do
            docker compose --env-file .env.dev -f docker-compose.dev.yaml build "$service"
          done
      - name: Test Java services
        run: |
          sed -i 's/\r$//' gradlew
          bash gradlew test --no-daemon --max-workers=2
      - name: Test Redis projection recovery
        env:
          REDIS_TEST_PORT: '16379'
        run: bash gradlew :FeedService:integrationTest --no-daemon --max-workers=2
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 7
      - name: Sign in to GHCR
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested application images
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for service in $SERVICES; do
            docker push "ghcr.io/kaze-nomi/unimeow-$service:$VERSION"
          done
      - name: Publish the deployment artifact
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -czf unimeow.tar.gz docker-compose.prod.yaml Monitoring/prometheus.yml \
            UserService/src/main/resources/db/migration \
            PostService/src/main/resources/db/migration \
            NotificationService/src/main/resources/db/migration
          printf 'Production версия %s\n' "${VERSION#v}" > release-notes.txt
          gh release create "$VERSION" unimeow.tar.gz --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$VERSION" --notes-file release-notes.txt
