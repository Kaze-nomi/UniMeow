name: Release retention
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Plan is read-only. Apply requires the exact previously reviewed plan hash.'
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      reviewed_plan_sha256:
        description: 'For apply only: SHA256 from the previous plan output'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  # Release, Deploy, Rollback and retention use this same repository-wide key.
  group: production-release-lifecycle
  cancel-in-progress: false
jobs:
  retention:
    # Only the successful, explicitly dispatched Release from this repository's
    # default branch can trigger automatic policy maintenance. No PR artifacts
    # or executable files from the triggering run are downloaded or executed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - name: Validate the manual operation
        env:
          MODE: ${{ github.event_name == 'workflow_run' && 'maintain' || inputs.mode }}
          REVIEWED_PLAN: ${{ inputs.reviewed_plan_sha256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          [[ "$MODE" == plan || "$MODE" == apply || "$MODE" == maintain ]]
          if [[ "$MODE" == apply ]]; then
            [[ "$REVIEWED_PLAN" =~ ^[0-9a-f]{64}$ ]]
          else
            [[ -z "$REVIEWED_PLAN" ]]
          fi
      - name: Configure pinned SSH identity
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Verify protected server state and plan or apply under its deployment lock
        env:
          MODE: ${{ github.event_name == 'workflow_run' && 'maintain' || inputs.mode }}
          REVIEWED_PLAN: ${{ inputs.reviewed_plan_sha256 }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$SSH_PORT" =~ ^[0-9]+$ ]]
          COMMAND='sudo -n /usr/local/sbin/unimeow-retention plan'
          if [[ "$MODE" == maintain ]]; then
            COMMAND='sudo -n /usr/local/sbin/unimeow-retention maintain'
          fi
          if [[ "$MODE" == apply ]]; then
            [[ "$REVIEWED_PLAN" =~ ^[0-9a-f]{64}$ ]]
            COMMAND="sudo -n /usr/local/sbin/unimeow-retention apply $REVIEWED_PLAN"
          fi
          # The installed, root-owned helper reads the token from stdin, never
          # disk or process arguments. SSH uploads no executable code or state.
          printf '%s' "$GH_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$COMMAND" > retention-result.json
          python3 - <<'PY'
          import json, os
          result = json.load(open('retention-result.json'))
          plan = result['plan']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Release retention: **' + result['result'] + '**\n\n')
              out.write('Reviewed plan SHA256: `' + plan['plan_sha256'] + '`\n\n')
              out.write('Retained releases: ' + ', '.join('`' + tag + '`' for tag in plan['retained_releases']) + '\n\n')
              out.write('Release records to remove: ' + str(len(plan['delete_releases'])) + '\n\n')
              out.write('Package versions to remove: ' + str(len(plan['delete_package_versions'])) + '\n\n')
              out.write('Baseline archives, backups, volumes and Git tags are preserved.\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Preserve the reviewable plan output
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: retention-plan-${{ github.run_id }}
          path: retention-result.json
          if-no-files-found: error
          retention-days: 7
          # Diagnostic only: rollback and retention never depend on this artifact.
