name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25.0.1'
          cache: gradle
      - name: Unit and real infrastructure integration tests
        run: ./gradlew test --no-daemon --max-workers=2
        env:
          JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
          GRADLE_OPTS: -Xmx2g
      - name: Required PostgreSQL, Redis, Kafka and two-Gateway integration scenarios
        run: bash ops/test-integrations.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: java-test-results
          path: |
            **/build/test-results/test/*.xml
            **/build/test-results/integrationTest/*.xml
          retention-days: 7
  frontend-and-operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install locked dependencies, test public configuration, build
        working-directory: Frontend
        run: yarn install --frozen-lockfile && yarn test && yarn build
      - name: Backup, release validation and deployment state tests
        run: python3 -m unittest discover -s ops/tests -v
