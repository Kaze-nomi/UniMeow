syntax = "proto3";

package uni.grpc.notification;
option java_multiple_files = true;
option java_package = "uni.grpc.notification";

service NotificationService {
    rpc GetNotifications   (GetNotificationsRequest)   returns (NotificationListResponse);
    rpc MarkAllRead        (MarkAllReadRequest)        returns (MarkAllReadResponse);
    rpc GetUnreadCount     (GetUnreadCountRequest)     returns (GetUnreadCountResponse);
}

message GetNotificationsRequest {
    string user_id = 1;
    int32  page    = 2;
    int32  size    = 3;
}

message MarkAllReadRequest {
    string user_id = 1;
}

message MarkAllReadResponse {
    bool success = 1;
}

message GetUnreadCountRequest {
    string user_id = 1;
}

message GetUnreadCountResponse {
    int64 count = 1;
}

message NotificationProto {
    string id         = 1;
    string user_id    = 2;
    string actor_id   = 3;
    string type       = 4;
    string entity_id  = 5;
    string entity_type = 6;
    bool   is_read    = 7;
    string created_at = 8;
    optional string parent_entity_id = 9;
}

message NotificationListResponse {
    repeated NotificationProto notifications = 1;
    int64                      total         = 2;
}
